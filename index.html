<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>심연 원정</title>
  <style>
    :root{color-scheme:dark;--ink:#f4ead7;--muted:#b7aa98;--gold:#edbd70;--panel:#171923;--edge:#393444;--red:#e46d63}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#392d3e,#12141c 65%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
    main{max-width:1100px;margin:auto;padding:22px 18px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.title{font-size:clamp(23px,4vw,36px);font-weight:900;letter-spacing:-1px}.title span{color:var(--gold)}.hint{color:var(--muted);font-size:13px;text-align:right}
    .frame{position:relative;border:1px solid #554453;border-radius:14px;overflow:hidden;background:#171820;box-shadow:0 18px 70px #0008}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
    #overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#101117d9;backdrop-filter:blur(4px)}
    #overlay.hidden{display:none}.dialog{width:min(720px,100%);max-height:100%;overflow:auto;background:linear-gradient(145deg,#27232e,#171923);border:1px solid #5b4a50;border-radius:14px;padding:24px;box-shadow:0 15px 50px #0009}
    h1,h2,p{margin-top:0}h1{font-size:clamp(24px,4vw,38px);margin-bottom:8px}h2{font-size:23px;margin-bottom:6px}.sub{color:var(--muted);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
    button{font:inherit;color:var(--ink);cursor:pointer}.card{min-height:116px;text-align:left;background:#211f29;border:1px solid var(--edge);border-radius:10px;padding:14px;transition:.15s}.card:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);background:#302836}.card:disabled{opacity:.42;cursor:not-allowed}.card strong{display:block;color:var(--gold);font-size:18px;margin-bottom:7px}.card small{color:var(--muted);line-height:1.4}.primary,.secondary{border-radius:8px;padding:11px 18px;border:1px solid #bd8f55;background:#a66d39;color:#fff4df;font-weight:800}.primary:hover{background:#bd8045}.secondary{background:#26232d;border-color:#514553}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:12px 4px}.controls b{color:var(--ink)}.tag{display:inline-block;padding:4px 8px;border:1px solid #534653;border-radius:99px;color:var(--gold);font-size:12px;margin-right:4px}
    .mobile{display:none;position:absolute;inset:auto 10px 10px;justify-content:space-between;align-items:end;pointer-events:none}.pad,.mobile button{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:3px}.mobile button{width:42px;height:42px;border-radius:8px;background:#26232dd9;border:1px solid #887264;font-weight:bold}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.mobile .attack{width:68px;height:68px;border-radius:50%;background:#963f3b}
    @media(max-width:640px){main{padding:12px 8px}.hint{max-width:45%;font-size:11px}.controls{font-size:11px;gap:6px}.mobile{display:flex}#overlay{padding:10px}.dialog{padding:18px}.card{min-height:96px;padding:10px}}
  </style>
</head>
<body>
<main>
  <div class="top"><div class="title">심연 <span>원정</span></div><div class="hint">10개 층을 돌파하고 심연의 왕을 물리치세요</div></div>
  <div class="frame">
    <canvas id="game" width="960" height="540" aria-label="심연 원정 게임 화면"></canvas>
    <div id="overlay"></div>
    <div class="mobile" id="mobile">
      <div class="pad">
        <button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button>
        <button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button>
      </div>
      <button class="attack" data-key="Space">공격</button>
    </div>
  </div>
  <div class="controls"><span><b>이동</b> WASD / 방향키</span><span><b>공격</b> 스페이스바 또는 클릭</span><span><b>특수 능력</b> Q</span><span><b>회복 물약</b> R</span><span><b>일시정지</b> Esc</span></div>
</main>
<script>
(() => {
  "use strict";
  const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),overlay=document.getElementById("overlay");
  const W=canvas.width,H=canvas.height,rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const floors=["폐허가 된 마을","지하 묘지","불타는 광산","얼어붙은 숲","고대 신전","독 늪지","번개 첨탑","얼어붙은 성","핏빛 성소","심연"];
  const themes=["#5c493a","#3b4056","#70412f","#526273","#594b70","#3e6654","#55577c","#566878","#713b4c","#372d4b"];
  const bosses=["허수아비 대장","뼈 수집가","용광로 골렘","서리 늑대","타락한 대사제","독개구리 왕","뇌조","서리 드래곤","피의 군주","심연의 왕"];
  const monsters=[["들쥐","굶은 농부","까마귀","돌팔매꾼","허수아비 병사"],["해골병","뼈 궁수","좀비","묘지 박쥐","원혼"],["불씨 슬라임","용암 두더지","화염 박쥐","바위 게","폭약 통"],["눈사람 병사","서리 늑대 새끼","얼음 요정","서리 곰 새끼"],["석상 수호병","성직자 환영","시계 톱니 정령","빛의 구체"],["독개구리","늪 거머리","포자 버섯","독침 잠자리"],["정전기 쥐","번개 새","전기 해파리","피뢰침 병사"],["얼음 병사","성벽 궁수","얼음 가고일","서리 기사"],["피 거머리","흡혈 박쥐","피 노예","피의 사제"],["그림자 병사","심연 눈알","공허 촉수","차원 틈 벌레","별빛 정령"]];
  const heroes=[
    {id:"warrior",name:"검사",role:"기사 · 장검",desc:"체력 3칸 + 방패 1칸 · 검파로 투사체를 막습니다.",hp:6,damage:16,rate:.38,speed:210,skill:"검파"},
    {id:"archer",name:"궁수",role:"사냥꾼 · 단궁",desc:"긴 사거리의 관통 화살을 쏩니다. 5층 보스 처치 후 해금.",hp:6,damage:22,rate:.6,speed:220,skill:"관통 사격"},
    {id:"gunner",name:"총잡이",role:"방랑자 · 리볼버",desc:"빠른 연사와 탄창 재장전. 10층 정복 후 해금.",hp:6,damage:10,rate:.15,speed:190,skill:"속사"}
  ];
  const items=[
    ["낡은 숫돌","공격력 +25%","damage","일반"],["가벼운 장갑","공격 속도 +20%","speed","일반"],["매의 눈","탄환 속도 +20%","range","일반"],["붉은 심장 조각","최대 체력 +1칸, 체력 회복","heart","희귀"],
    ["네잎클로버","행운 +2 · 골드 획득 증가","luck","희귀"],["독니","공격에 지속 독 추가","poison","희귀"],["불씨 조각","공격에 화염 추가","fire","희귀"],["서리 조각","적을 느리게 하는 얼음 공격","ice","희귀"],
    ["쌍둥이 별","탄환이 둘로 갈라집니다","twin","영웅"],["유령의 손","탄환이 적을 관통합니다","pierce","영웅"],["폭죽통","적중 시 추가 폭발 피해","boom","영웅"],["흡혈 송곳니","적 처치 시 체력 회복","vampire","영웅"],
    ["긴 칼날","공격 범위 증가","damage","희귀"],["불사조 깃털","이번 원정에서 한 번 부활","revive","전설"]
  ];
  let saved={xp:0,unlocked:["warrior"],clears:0,clearedHeroes:[]};try{saved={...saved,...JSON.parse(localStorage.getItem("abyssRunSave")||"{}")}}catch(_){}
  let mode="title",hero=heroes[0],player,enemies=[],bullets=[],shots=[],floor=0,room=0,kills=0,gold=0,xp=0,itemsOwned=[],cool=0,skillCool=0,hurt=0,potion=1,keys={},mouse={x:W/2,y:H/2,down:false},last=0,elapsed=0,msg="",boss=false,paused=false,revive=false;
  const save=()=>{try{localStorage.setItem("abyssRunSave",JSON.stringify(saved))}catch(_){msg="브라우저 저장 공간을 사용할 수 없어 진행 정보를 저장하지 못했습니다."}};
  function show(title,text,cards,actions){overlay.classList.remove("hidden");overlay.innerHTML=`<section class="dialog"><h1>${title}</h1><p class="sub">${text}</p>${cards?`<div class="cards">${cards}</div>`:""}<div class="row">${actions||""}</div></section>`}
  function titleScreen(){mode="title";show("심연 원정","기획 시트 기반 10층 액션 로그라이트 · 경험치 누적 "+saved.xp+" · 정복 "+saved.clears+"회",null,`<button class="primary" id="begin">원정 시작</button>`);document.getElementById("begin").onclick=characterScreen}
  function characterScreen(){mode="select";const cards=heroes.map((h,i)=>`<button class="card" data-hero="${i}" ${saved.unlocked.includes(h.id)?"":"disabled"}><strong>${h.name}</strong><span class="tag">${h.role}</span><small>${h.desc}</small></button>`).join("");show("원정대 선택","원하는 캐릭터를 골라 던전에 입장하세요. 해금된 캐릭터만 선택할 수 있습니다.",cards,`<button class="secondary" id="back">돌아가기</button>`);overlay.querySelectorAll("[data-hero]").forEach(b=>b.onclick=()=>startRun(heroes[+b.dataset.hero]));document.getElementById("back").onclick=titleScreen}
  function startRun(h){hero=h;floor=0;room=0;kills=0;gold=0;xp=0;itemsOwned=[];potion=h.id==="warrior"?1:0;revive=false;player={x:W/2,y:H/2,hp:h.hp,max:h.hp,damage:h.damage,speed:h.speed};enterRoom(false)}
  function enterRoom(isBoss){boss=isBoss;mode="battle";overlay.classList.add("hidden");player.x=W/2;player.y=H/2;bullets=[];shots=[];cool=0;enemies=[];const count=isBoss?1:3+Math.min(3,Math.floor(floor/2));for(let i=0;i<count;i++){const name=isBoss?bosses[floor]:monsters[floor][Math.floor(Math.random()*monsters[floor].length)];const elite=!isBoss&&i===count-1&&Math.random()<.25;const scale=1+floor*.13;enemies.push({x:rand(80,W-80),y:rand(100,H-80),r:isBoss?34:elite?20:15,hp:(isBoss?160+floor*22:35+floor*8)*(elite?2:1)*scale,max:(isBoss?160+floor*22:35+floor*8)*(elite?2:1)*scale,speed:(isBoss?45:50+rand(0,20))*(1+floor*.025),name,isBoss,elite,cd:rand(.8,2),tele:0,poison:0,slow:0})}msg=isBoss?bosses[floor]+" 등장! 공격을 피하고 약점을 노리세요.":floors[floor]+" · 전투 "+(room+1)+"/2";overlay.classList.add("hidden")}
  function reward(){mode="reward";const offers=[];while(offers.length<3){const item=items[Math.floor(Math.random()*items.length)];if(!offers.includes(item))offers.push(item)}const cards=offers.map((it,i)=>`<button class="card" data-item="${i}"><strong>${it[0]}</strong><span class="tag">${it[3]}</span><small>${it[1]}</small></button>`).join("");show("보상 선택",`${floors[floor]}에서 전투를 마쳤습니다. 아이템 하나를 고르세요. 골드 ${gold} · 경험치 ${xp}`,cards);overlay.querySelectorAll("[data-item]").forEach((b,i)=>b.onclick=()=>{const it=offers[i];itemsOwned.push(it);applyItem(it);if(boss)finishFloor();else if(room===0){room=1;enterRoom(false)}else enterRoom(true)})}
  function applyItem(it){switch(it[2]){case"damage":player.damage*=1.25;break;case"speed":hero.rate*=.82;break;case"heart":player.max+=2;player.hp=Math.min(player.max,player.hp+2);break;case"poison":case"fire":case"ice":case"twin":case"pierce":case"boom":case"vampire":case"revive":break;default:gold+=5}}
  function finishFloor(){xp+=100;if(floor===4&&!saved.unlocked.includes("archer")){saved.unlocked.push("archer");save()}if(floor===9){xp+=2000;if(!saved.unlocked.includes("gunner"))saved.unlocked.push("gunner");saved.clears++;const firstClear=!saved.clearedHeroes.includes(hero.id);if(firstClear)saved.clearedHeroes.push(hero.id);const payout=xp+(firstClear?3000:0);saved.xp+=payout;save();mode="win";show("심연 정복!",`심연의 왕을 쓰러뜨렸습니다! 이번 원정 경험치 ${payout}, 골드 ${gold}. 총 경험치 ${saved.xp}.`,null,`<button class="primary" id="again">다시 원정</button><button class="secondary" id="home">처음으로</button>`);document.getElementById("again").onclick=characterScreen;document.getElementById("home").onclick=titleScreen;return}floor++;room=0;mode="floor";show(`${floor}층 · ${floors[floor]}`,`체력을 정비하고 다음 층으로 내려갑니다. 현재 체력 ${"♥".repeat(Math.ceil(player.hp/2))} · 골드 ${gold}`,null,`<button class="primary" id="continue">다음 층으로</button>`);document.getElementById("continue").onclick=()=>enterRoom(false)}
  function endRun(){const payout=Math.floor(xp*.8);saved.xp+=payout;save();mode="dead";show("원정 실패",`쓰러졌습니다. 획득 경험치의 80%인 ${payout}을 보존했습니다. 누적 경험치 ${saved.xp}.`,null,`<button class="primary" id="again">다시 도전</button><button class="secondary" id="home">처음으로</button>`);document.getElementById("again").onclick=characterScreen;document.getElementById("home").onclick=titleScreen}
  function kill(e){const n=enemies.indexOf(e);if(n<0)return;enemies.splice(n,1);kills++;xp+=e.isBoss?150:e.elite?20:2;gold+=e.isBoss?15:e.elite?6:1+Math.floor(Math.random()*2);if(kills%10===0&&itemsOwned.some(i=>i[2]==="vampire"))player.hp=Math.min(player.max,player.hp+1);if(!enemies.length)reward()}
  function hurtPlayer(amount){if(hurt>0)return;player.hp-=amount;hurt=1;if(player.hp<=0){if(itemsOwned.some(i=>i[2]==="revive")&&!revive){revive=true;player.hp=Math.ceil(player.max/2)}else endRun()}}
  function useSkill(){if(skillCool>0||mode!=="battle")return;skillCool=hero.id==="gunner"?5:8;if(hero.id==="warrior"){enemies.forEach(e=>{if(Math.hypot(e.x-player.x,e.y-player.y)<100)e.hp-=player.damage*1.6});bullets=[]}else if(hero.id==="archer"){for(let j=0;j<3;j++){const a=Math.atan2(mouse.y-player.y,mouse.x-player.x)+(j-1)*.14;shots.push({x:player.x,y:player.y,dx:Math.cos(a)*520,dy:Math.sin(a)*520,damage:player.damage*.8,pierce:true,life:1.2})}}else{for(let j=0;j<9;j++){const a=j*Math.PI*2/9;shots.push({x:player.x,y:player.y,dx:Math.cos(a)*400,dy:Math.sin(a)*400,damage:player.damage*.65,life:1})}}}
  function fire(){if(cool>0||mode!=="battle")return;cool=hero.rate;const angle=Math.atan2(mouse.y-player.y,mouse.x-player.x),speed=hero.id==="archer"?500:hero.id==="gunner"?430:380,damage=player.damage;for(let i=0;i<(itemsOwned.some(it=>it[2]==="twin")?2:1);i++){const a=angle+(i?-.12:0);shots.push({x:player.x,y:player.y,dx:Math.cos(a)*speed,dy:Math.sin(a)*speed,damage,pierce:hero.id==="archer"||itemsOwned.some(it=>it[2]==="pierce"),life:1.4,element:itemsOwned.some(it=>it[2]==="fire")?"fire":""})}}
  function update(dt){if(mode!=="battle"||paused)return;elapsed+=dt;cool=Math.max(0,cool-dt);skillCool=Math.max(0,skillCool-dt);hurt=Math.max(0,hurt-dt);for(const k of ["w","a","s","d","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"]){if(!keys[k])continue;const d=hero.speed*dt;if(k==="w"||k==="ArrowUp")player.y-=d;if(k==="s"||k==="ArrowDown")player.y+=d;if(k==="a"||k==="ArrowLeft")player.x-=d;if(k==="d"||k==="ArrowRight")player.x+=d}player.x=clamp(player.x,40,W-40);player.y=clamp(player.y,90,H-40);if(keys.Space||mouse.down)fire();
    for(const e of [...enemies]){const a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);if(e.isBoss){e.cd-=dt;if(e.tele>0){e.tele-=dt;if(e.tele<=0){const spread=floor>=4?7:5;for(let i=0;i<spread;i++){const q=a+(i-(spread-1)/2)*.22;bullets.push({x:e.x,y:e.y,dx:Math.cos(q)*(160+floor*9),dy:Math.sin(q)*(160+floor*9),r:6})}e.cd=2.2-floor*.06}}else if(e.cd<=0)e.tele=.7;if(d>65){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}}else{e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}if(d<e.r+15)hurtPlayer(e.isBoss?1:.5);if(e.tele>0){/* attack warning */}}
    for(const b of [...bullets]){b.x+=b.dx*dt;b.y+=b.dy*dt;if(Math.hypot(player.x-b.x,player.y-b.y)<19){bullets.splice(bullets.indexOf(b),1);hurtPlayer(.5)}}for(const s of [...shots]){s.x+=s.dx*dt;s.y+=s.dy*dt;s.life-=dt;if(s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H){shots.splice(shots.indexOf(s),1);continue}for(const e of [...enemies])if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+6){e.hp-=s.damage;if(itemsOwned.some(it=>it[2]==="poison"))e.hp-=s.damage*.12;if(itemsOwned.some(it=>it[2]==="boom")){for(const other of enemies)if(Math.hypot(other.x-e.x,other.y-e.y)<65)other.hp-=s.damage*.3}if(e.hp<=0)kill(e);if(!s.pierce){shots.splice(shots.indexOf(s),1);break}else s.damage*=.82}}
  }
  function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,themes[floor]||"#302c3d");bg.addColorStop(1,"#171922");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle="#ffffff0b";ctx.lineWidth=1;for(let x=28;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,70);ctx.lineTo(x,H);ctx.stroke()}for(let y=78;y<H;y+=42){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(W-20,y);ctx.stroke()}ctx.strokeStyle="#d2b48644";ctx.lineWidth=4;ctx.strokeRect(20,72,W-40,H-92);
    ctx.fillStyle="#15151ccc";ctx.fillRect(0,0,W,67);ctx.fillStyle="#f3e8d8";ctx.font="bold 19px sans-serif";ctx.fillText(`${floor+1}층 · ${floors[floor]||"폐허가 된 마을"}`,24,29);ctx.font="14px sans-serif";ctx.fillStyle="#c7b7a4";ctx.fillText(boss?"보스 전투":"전투 "+(room+1)+"/2",24,51);ctx.fillStyle="#e46d63";ctx.fillText("♥".repeat(Math.ceil(player?.hp||6)),W-210,28);ctx.fillStyle="#e7bf7c";ctx.fillText(`골드 ${gold}　경험치 ${xp}`,W-210,51);
    if(mode==="battle"){for(const b of bullets){ctx.fillStyle="#fb8770";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}for(const s of shots){ctx.fillStyle=s.element==="fire"?"#ffc45c":"#e8e1d3";ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()}for(const e of enemies){ctx.fillStyle=e.isBoss?"#ae4e5e":e.elite?"#b78b49":"#6c737b";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font=e.isBoss?"bold 13px sans-serif":"11px sans-serif";ctx.textAlign="center";ctx.fillText(e.name,e.x,e.y-e.r-14);ctx.fillStyle="#33292a";ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle="#df6c60";ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*clamp(e.hp/e.max,0,1),4);if(e.tele>0){ctx.strokeStyle="#ff8977";ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+10+(1-e.tele)*12,0,Math.PI*2);ctx.stroke()}}ctx.textAlign="left";if(player){ctx.fillStyle=hurt>0?"#fff":"#74bfd0";ctx.beginPath();ctx.arc(player.x,player.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#e8d4a9";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(Math.atan2(mouse.y-player.y,mouse.x-player.x))*26,player.y+Math.sin(Math.atan2(mouse.y-player.y,mouse.x-player.x))*26);ctx.stroke()}ctx.fillStyle="#ffffffb0";ctx.font="12px sans-serif";ctx.fillText(`아이템 ${itemsOwned.map(i=>i[0]).join(" · ")||"없음"}　특수 기술 ${skillCool>0?skillCool.toFixed(1)+"초":"준비"}　물약 ${potion}`,24,H-25);if(enemies.some(e=>e.tele>0)){ctx.fillStyle="#ffd2b0";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("공격 예고! 회피하세요",W/2,99);ctx.textAlign="left"}}
    if(mode==="title"){ctx.fillStyle="#f4ead7";ctx.font="bold 40px sans-serif";ctx.textAlign="center";ctx.fillText("심연 원정",W/2,H/2-34);ctx.font="17px sans-serif";ctx.fillStyle="#d4c7b5";ctx.fillText("원정 시작을 눌러 10개 층의 전투를 시작하세요",W/2,H/2+5);ctx.textAlign="left"}}
  function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
  function keyDown(e){const k=e.key===" "?"Space":e.key;keys[k]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.repeat)return;if(k.toLowerCase()==="q")useSkill();if(k.toLowerCase()==="r"&&mode==="battle"&&potion>0&&player.hp<player.max){player.hp=Math.min(player.max,player.hp+2);potion--}if(e.key==="Escape"&&mode==="battle"){paused=!paused;if(paused)show("일시정지","전투가 멈췄습니다.",null,`<button class="primary" id="resume">계속하기</button>`);else overlay.classList.add("hidden");const b=document.getElementById("resume");if(b)b.onclick=()=>{paused=false;overlay.classList.add("hidden")}}}
  function keyUp(e){keys[e.key===" "?"Space":e.key]=false}
  function point(e){const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}
  window.addEventListener("keydown",keyDown);window.addEventListener("keyup",keyUp);canvas.addEventListener("pointermove",point);canvas.addEventListener("pointerdown",e=>{point(e);mouse.down=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointerup",()=>mouse.down=false);canvas.addEventListener("pointercancel",()=>mouse.down=false);
  document.querySelectorAll(".mobile [data-key]").forEach(b=>{const key=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});for(const ev of ["pointerup","pointercancel","pointerleave"])b.addEventListener(ev,()=>keys[key]=false)});
  titleScreen();requestAnimationFrame(loop);
})();
</script>
